<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create a secure account." />
    <title>Sign up | SecureAuth</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="signup">
    <div class="page-shell">
      <header class="site-header"><a class="logo" href="index.html" aria-label="SecureAuth home"><span class="logo-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3 19 6v5.1c0 4.4-2.8 7.2-7 8.9-4.2-1.7-7-4.5-7-8.9V6l7-3Z" fill="currentColor" opacity=".14" stroke="currentColor" stroke-width="1.6"/><path d="m8.8 11.8 2.1 2.1 4.4-4.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>SecureAuth</span></a><span class="header-note">Create account</span></header>
      <main class="auth-card signup-card" aria-labelledby="page-title">
        <div class="card-icon" aria-hidden="true"><svg viewBox="0 0 28 28" fill="none"><circle cx="14" cy="14" r="14" fill="#e8f0ff"/><path d="M14 8.1v11.8M8.1 14h11.8" stroke="#3f6fe8" stroke-width="1.7" stroke-linecap="round"/></svg></div>
        <h1 id="page-title">Create an account</h1><p class="intro">Set up your account to get started</p>
        <form id="signup-form" class="auth-form" novalidate>
          <div class="field"><label for="signup-name">Full name</label><div class="input-wrap"><input id="signup-name" type="text" autocomplete="name" placeholder="Enter your full name" required /></div><span id="signup-name-error" class="field-error" role="alert"></span></div>
          <div class="field"><label for="signup-email">Email address</label><div class="input-wrap"><input id="signup-email" type="email" autocomplete="email" placeholder="Enter your email" required /></div><span id="signup-email-error" class="field-error" role="alert"></span></div>
          <div class="field"><label for="signup-password">Password</label><div class="input-wrap"><input id="signup-password" type="password" autocomplete="new-password" placeholder="Create a strong password" required /><button class="eye-button toggle-password" type="button" aria-label="Show password" data-target="signup-password"><svg viewBox="0 0 20 20" fill="none"><path d="M2.5 10s2.6-4 7.5-4 7.5 4 7.5 4-2.6 4-7.5 4-7.5-4-7.5-4Z" stroke="currentColor" stroke-width="1.35"/><circle cx="10" cy="10" r="1.8" stroke="currentColor" stroke-width="1.35"/></svg></button></div><div class="strength"><div class="strength-bar"><span id="strength-bar"></span></div><span id="strength-label">Use a strong password</span></div><ul class="password-rules"><li data-rule="length"><span></span>8+ characters</li><li data-rule="upper"><span></span>One uppercase letter</li><li data-rule="number"><span></span>One number</li><li data-rule="symbol"><span></span>One special character</li></ul><span id="signup-password-error" class="field-error" role="alert"></span></div>
          <div class="field"><label for="signup-confirm">Confirm password</label><div class="input-wrap"><input id="signup-confirm" type="password" autocomplete="new-password" placeholder="Re-enter your password" required /><button class="eye-button toggle-password" type="button" aria-label="Show password" data-target="signup-confirm"><svg viewBox="0 0 20 20" fill="none"><path d="M2.5 10s2.6-4 7.5-4 7.5 4 7.5 4-2.6 4-7.5 4-7.5-4-7.5-4Z" stroke="currentColor" stroke-width="1.35"/><circle cx="10" cy="10" r="1.8" stroke="currentColor" stroke-width="1.35"/></svg></button></div><span id="signup-confirm-error" class="field-error" role="alert"></span></div>
          <label class="checkbox-label terms"><input id="terms" type="checkbox" required /><span class="checkbox" aria-hidden="true"></span><span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</span></label>
          <button class="button primary" type="submit">Create account</button><div id="signup-feedback" class="feedback" role="status" aria-live="polite"></div>
        </form>
        <p class="switch-page">Already have an account? <a href="index.html">Log in</a></p>
      </main>
      <footer class="page-footer"><span>© 2026 SecureAuth</span><span><a href="#">Privacy</a><a href="#">Terms</a></span></footer>
    </div>
    <script src="app.js"></script>
  </body>
</html>
