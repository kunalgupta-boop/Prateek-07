<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Secure login page." />
    <title>Log in | SecureAuth</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="login">
    <div class="page-shell">
      <header class="site-header">
        <a class="logo" href="index.html" aria-label="SecureAuth home"><span class="logo-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3 19 6v5.1c0 4.4-2.8 7.2-7 8.9-4.2-1.7-7-4.5-7-8.9V6l7-3Z" fill="currentColor" opacity=".14" stroke="currentColor" stroke-width="1.6"/><path d="m8.8 11.8 2.1 2.1 4.4-4.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>SecureAuth</span></a>
        <span class="header-note">Secure login</span>
      </header>

      <main class="auth-card" aria-labelledby="page-title">
        <div class="card-icon" aria-hidden="true"><svg viewBox="0 0 28 28" fill="none"><circle cx="14" cy="14" r="14" fill="#e8f0ff"/><path d="M14 7.5 19.2 9.7v3.8c0 3.2-2.1 5.3-5.2 6.5-3.1-1.2-5.2-3.3-5.2-6.5V9.7L14 7.5Z" stroke="#3f6fe8" stroke-width="1.4"/><path d="m11.4 13.7 1.8 1.8 3.5-3.6" stroke="#3f6fe8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <h1 id="page-title">Welcome Back</h1>
        <p class="intro">Log in to continue to your account</p>

        <form id="login-form" class="auth-form" novalidate>
          <div class="field"><label for="login-email">Email address</label><div class="input-wrap"><span class="input-icon" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none"><rect x="3" y="4.5" width="14" height="11" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="m4 6 6 4.2L16 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span><input id="login-email" type="email" autocomplete="email" placeholder="Enter your email" required /></div><span id="login-email-error" class="field-error" role="alert"></span></div>
          <div class="field"><div class="label-line"><label for="login-password">Password</label><a href="#" id="forgot-password-link">Forgot password?</a></div><div class="input-wrap"><span class="input-icon" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none"><rect x="4" y="8.5" width="12" height="8" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M6.5 8.5V6.7a3.5 3.5 0 0 1 7 0v1.8" stroke="currentColor" stroke-width="1.4"/><path d="M10 11.5v2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></span><input id="login-password" type="password" autocomplete="current-password" placeholder="Enter your password" required /><button class="eye-button toggle-password" type="button" aria-label="Show password" data-target="login-password"><svg viewBox="0 0 20 20" fill="none"><path d="M2.5 10s2.6-4 7.5-4 7.5 4 7.5 4-2.6 4-7.5 4-7.5-4-7.5-4Z" stroke="currentColor" stroke-width="1.35"/><circle cx="10" cy="10" r="1.8" stroke="currentColor" stroke-width="1.35"/></svg></button></div><span id="login-password-error" class="field-error" role="alert"></span></div>
          <div class="form-options"><label class="checkbox-label"><input type="checkbox" /><span class="checkbox" aria-hidden="true"></span><span>Remember me</span></label><span class="rate-note"><span class="green-dot"></span> Protected login</span></div>
          <button class="button primary" type="submit">Log In</button>
          <div id="login-feedback" class="feedback" role="status" aria-live="polite"></div>
        </form>

        <div class="divider"><span>OR</span></div>
        <button class="button google-button" id="google-button" type="button"><span class="google-icon" aria-hidden="true">G</span>Continue with Google</button>
        <p class="switch-page">Don’t have an account? <a href="signup.html">Sign up</a></p>
      </main>

      <footer class="page-footer"><span>© 2026 SecureAuth</span><span><a href="#">Privacy</a><a href="#">Terms</a></span></footer>
    </div>
    <script src="app.js"></script>
  </body>
</html>
